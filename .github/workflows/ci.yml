name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # The WPF host (net10.0-windows) can't build on Linux, so CI targets the
      # cross-platform projects: Contracts, Server, and the domain tests.
      - name: Restore
        run: |
          dotnet restore src/QuizGame.Server/QuizGame.Server.csproj
          dotnet restore tests/QuizGame.Domain.Tests/QuizGame.Domain.Tests.csproj

      - name: Build
        run: |
          dotnet build src/QuizGame.Server/QuizGame.Server.csproj -c Release --no-restore
          dotnet build tests/QuizGame.Domain.Tests/QuizGame.Domain.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/QuizGame.Domain.Tests/QuizGame.Domain.Tests.csproj -c Release --no-build --verbosity normal
