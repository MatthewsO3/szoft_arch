<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14161f">
  <title>Strategic Quiz</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header id="header" class="header" hidden>
    <span id="me-chip" class="chip"></span>
    <span id="me-name" class="me-name"></span>
    <span id="conn" class="conn" data-state="offline" title="Connection"></span>
  </header>

  <main>
    <!-- Join -->
    <section id="screen-join" class="screen" hidden>
      <h1>Strategic Quiz</h1>
      <form id="join-form" autocomplete="off" novalidate>
        <label for="code">Room code</label>
        <input id="code" name="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="123456" required>

        <label for="name">Your name</label>
        <input id="name" name="name" maxlength="20" placeholder="Nickname" required>

        <p id="join-error" class="error" role="alert" hidden></p>
        <button id="join-btn" type="submit">Join</button>
      </form>
    </section>

    <!-- Lobby / waiting -->
    <section id="screen-lobby" class="screen" hidden>
      <h1>You're in!</h1>
      <p class="muted">Waiting for the host to start the game…</p>
      <p><strong>Room <span id="lobby-code"></span></strong> · <span id="lobby-count">0</span> players</p>
      <ul id="player-list" class="players"></ul>
      <p id="lobby-offline" class="error" hidden>
        Connection lost. <button id="reconnect-btn" type="button">Reconnect</button>
      </p>
      <button id="leave-btn" type="button" class="secondary">Leave room</button>
    </section>
    <section id="screen-question" class="screen" hidden aria-label="Question round">
      <h1>Look at the projector</h1>
      <p class="countdown" id="question-time" aria-label="Time remaining"></p>
      <div id="question-options" class="question-options"></div>
      <form id="estimate-form" hidden novalidate>
        <label for="estimate">Your estimate <span id="estimate-unit"></span></label>
        <input id="estimate" inputmode="decimal" autocomplete="off" maxlength="40">
        <button id="estimate-submit" type="submit">Send answer</button>
      </form>
      <p id="question-status" role="status" aria-live="polite"></p>
      <p id="game-offline" class="error" hidden>Connection lost.
        <button id="game-reconnect-btn" type="button">Reconnect</button>
      </p>
      <div id="round-result" hidden>
        <h2 id="correct-answer"></h2>
        <p id="personal-result"></p>
        <ol id="round-ranking" class="ranking"></ol>
      </div>
    </section>
    <!-- Map / base selection -->
    <section id="screen-map" class="screen" hidden aria-label="Map">
      <h1 id="map-title">Map</h1>
      <p class="countdown" id="map-time"></p>
      <p id="map-status" role="status" aria-live="polite" class="muted"></p>
      <div id="map-grid" class="map-grid"></div>
      <ul id="map-scores" class="players"></ul>
    </section>
  </main>

  <script src="js/lib/signalr.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
